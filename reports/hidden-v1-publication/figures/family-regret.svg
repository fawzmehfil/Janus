<text x="28.0" y="64.0" fill="#526078" font-family="Arial, sans-serif" font-size="14">Mean regret as a share of the 20-period reference surplus.</text>
<text x="217.0" y="118.0" fill="#172033" font-family="Arial, sans-serif" font-size="16" text-anchor="end">Supply shortage</text>
