<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Regret was concentrated in seller-collusion worlds</title>
<desc id="desc">Horizontal bars compare mean normalized regret across four scenario families.</desc>
