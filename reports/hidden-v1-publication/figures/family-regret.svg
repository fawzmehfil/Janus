<text x="260.7" y="258.0" fill="#172033" font-family="Arial, sans-serif" font-size="14">0.071%</text>
<text x="217.0" y="328.0" fill="#172033" font-family="Arial, sans-serif" font-size="16" text-anchor="end">Seller collusion</text>
