[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "janus-market-eval"
version = "0.1.0"
description = "Counterfactual evaluation of LLM market intervention under causal ambiguity"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fawz Mehfil" }]
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
]

[project.scripts]
janus = "janus.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/janus"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["janus"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
